# cbindgen settings for the C header the Swift shells import.
# The Rust names already carry their prefixes (P5Control, p5_split_new), so
# no [export]/[fn] prefix is configured: cbindgen's export prefix would turn
# P5Control into P5P5Control, and its fn prefix is a literal token emitted
# before every declaration, not a name prefix.
language = "C"
include_guard = "PLAYER5_H"
autogen_warning = "/* Generated by cbindgen from core/ffi; do not edit. See scripts/gen-header.sh */"
include_version = true
cpp_compat = true
usize_is_size_t = true

[fn]
rename_args = "SnakeCase"
