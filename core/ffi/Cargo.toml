[package]
name = "player5-ffi"
description = "player5 C ABI for the Swift shells (macOS, iOS)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "player5"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Ableton Link source for p5_control_start_source(kind 3). Off by default:
# it compiles in the GPLv2+ Link SDK (ADR-0005).
ableton-link = ["sync/ableton-link"]

[dependencies]
engine.workspace = true
sequencer.workspace = true
sync.workspace = true
serde_json.workspace = true

[lints]
workspace = true
