[package]
name = "player5-bridge"
description = "Headless relay: joins the booth network clock and serves it to browsers over WebSocket"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "player5-bridge"
path = "src/main.rs"

[features]
default = []
# Ableton Link source. Off by default: compiles in the GPLv2+ Link SDK
# (ADR-0005).
ableton-link = ["sync/ableton-link"]

[dependencies]
sync.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
