name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt + clippy + test (${{ matrix.os }})
    # Both platforms on purpose: the golden-master tests must produce the
    # same PCM hash on Linux and macOS (ADR-0002).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Render smoke test
        run: cargo run -p render -- patterns/four-on-the-floor.json /tmp/four.wav --fingerprint

  link-feature:
    name: Ableton Link feature build (GPL, off by default; ADR-0005)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy with ableton-link
        run: cargo clippy -p sync -p player5-bridge -p player5-ffi --features "sync/ableton-link player5-bridge/ableton-link player5-ffi/ableton-link" --all-targets -- -D warnings
      - name: Test with ableton-link
        run: cargo test -p sync -p player5-bridge -p player5-ffi --features "sync/ableton-link player5-bridge/ableton-link player5-ffi/ableton-link"

  web:
    name: web (wasm + JS core + vite + playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build wasm module
        working-directory: .
        run: scripts/build-wasm.sh
      - name: Build the bridge and the fake booth (end-to-end tests against the real binary)
        working-directory: .
        run: cargo build -p player5-bridge --bins --examples
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Wasm and JS core renders match the native golden masters
        run: npm run verify-wasm
      - name: Build (PWA)
        run: npm run build
      - name: Build (single file)
        run: npm run build:single
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright (instrument, runtimes, MIDI, bridge, offline, single file)
        run: npm test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
      - name: Upload single-file build
        uses: actions/upload-artifact@v4
        with:
          name: player5-single-file
          path: apps/web/dist-single/player5.html
          retention-days: 14
