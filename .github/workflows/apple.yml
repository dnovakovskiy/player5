name: Apple

# Builds the Rust core as an XCFramework, then the shared Swift package
# (build + tests), the iOS app (simulator) and the macOS app, all unsigned.
# See ADR-0008 and apps/mac/README.md.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # XcodeGen is all brew installs; skip the slow (and occasionally failing)
  # auto-update of the runner's formulae.
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  apple:
    name: xcframework + SwiftPM + iOS/macOS apps
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: apple

      - name: Install cbindgen and XcodeGen
        run: |
          command -v cbindgen || cargo install --locked cbindgen
          brew install xcodegen

      - name: Tool versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          rustc --version
          cbindgen --version
          xcodegen --version

      - name: Build Player5Core.xcframework
        run: scripts/build-xcframework.sh

      - name: Swift package build
        working-directory: apps/mac
        run: swift build

      - name: Swift package tests (pattern model, share links, FFI smoke)
        working-directory: apps/mac
        run: swift test

      - name: iOS app (simulator, unsigned)
        working-directory: apps/ios
        run: |
          xcodegen generate
          xcodebuild build \
            -project Player5.xcodeproj \
            -scheme Player5 \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-ios" \
            CODE_SIGNING_ALLOWED=NO

      - name: macOS app (unsigned)
        working-directory: apps/mac
        run: |
          xcodegen generate
          xcodebuild build \
            -project Player5Mac.xcodeproj \
            -scheme Player5Mac \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-mac" \
            CODE_SIGNING_ALLOWED=NO
