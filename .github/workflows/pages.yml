name: Pages

# Publishes the web app (apps/web) to GitHub Pages.
#
# One-time setup by a repo admin (cannot be done from CI with GITHUB_TOKEN):
#   1. Settings → Pages → Build and deployment → Source: "GitHub Actions".
#   2. Settings → Secrets and variables → Actions → Variables →
#      New repository variable PAGES_ENABLED = true.
# Until both are done the deploy job is skipped (not failed); the build job
# still runs so a broken production build shows up on every push.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build wasm module
        run: scripts/build-wasm.sh
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Build
        working-directory: apps/web
        run: npm run build
      - name: Single-file build (offline / embeddable copy)
        working-directory: apps/web
        run: |
          if npm run | grep -q "build:single"; then
            npm run build:single
            cp dist-single/player5.html dist/player5-standalone.html
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: vars.PAGES_ENABLED == 'true' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
